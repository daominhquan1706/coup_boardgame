name: coup_boardgame
description: "A fast-paced online board game experience"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management - Optimized
  get: ^4.6.6
  
  # UI Components - Lightweight alternatives
  # flutter_spinkit: ^5.2.0  # Removed - using custom loading indicators
  responsive_framework: ^1.1.1  # Consider replacing with responsive_sizer for better performance
  
  # Date/Time - Only if needed
  # flutter_datetime_picker: ^1.5.1  # Removed - not heavily used
  
  # Fonts - Optimized approach
  google_fonts: ^6.1.0  # Keep but optimize usage
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Firebase - Tree-shaken imports
  firebase_core: ^2.24.2
  cloud_firestore: ^4.15.4
  firebase_auth: ^4.19.5
  
  # Storage & Caching
  get_storage: ^2.1.1
  
  # UI Feedback
  flutter_easyloading: ^3.0.5
  
  # JSON Handling
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.3.3
  json_serializable: ^6.6.2

# Performance optimizations
flutter:
  uses-material-design: true
  
  # Optimize font loading
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  
  # Optimize assets
  assets:
    - assets/images/
    - assets/icons/
    
  # Enable deferred loading
  generate: true